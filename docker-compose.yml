version: '3.8'

services:
  # Основной бот
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis
    networks:
      - bot_network
    # Раскомментировать для PostgreSQL
    #   - postgres

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: school_bot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bot_network
    command: redis-server --appendonly yes

  # PostgreSQL (опционально)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: school_bot_postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - bot_network

volumes:
  redis_data:
  # postgres_data:

networks:
  bot_network:
    driver: bridge
